<style>
:root{
  --bg:#04080d;
  --bg2:#07121c;
  --panel:#081725;
  --panel2:#0c1925;
  --text:#f6f8f7;
  --muted:#a7b8c6;
  --line:rgba(160,190,215,.14);
  --accent:#1483f5;
  --accent2:#0b63bf;
  --accent-soft:rgba(20,131,245,.14);
  --price-blue:#11e7a2;
  --price-green:#11e7a2;
  --blue:#1483f5;
  --blue2:#0b63bf;
  --yellow:#ffd447;
  --max:1180px;
  --shadow:0 28px 80px rgba(0,0,0,.30);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:
  radial-gradient(circle at 20% 0%, rgba(15,122,239,.06), transparent 24rem),
  radial-gradient(circle at 90% 12%, rgba(15,122,239,.06), transparent 26rem),
  var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.48;
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:32px 32px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.45),transparent 70%);
}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
button{font:inherit}
.container{width:min(calc(100% - 34px),var(--max));margin:0 auto}
.topbar{
  padding:10px 0;text-align:center;background:#07131f;border-bottom:1px solid var(--line);
  color:#d7e3ef;font-size:12px;letter-spacing:.01em;
}
.topbar b{color:var(--accent)}
.hero{
  position:relative;padding:28px 0 46px;overflow:hidden;
  background:
    radial-gradient(circle at 70% 28%, rgba(15,122,239,.14), transparent 30%),
    linear-gradient(180deg,#f4f9fe 0%,#04080d 100%);
}
.hero:after{
  content:"";position:absolute;right:-12%;top:16%;width:70vw;height:70vw;max-width:900px;max-height:900px;
  border-radius:50%;border:1px solid rgba(15,122,239,.12);box-shadow:0 0 120px rgba(15,122,239,.06) inset;
  pointer-events:none;
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-weight:950;letter-spacing:-.045em;font-size:18px}
.brand span{color:var(--accent)}
.secure-mini{display:inline-flex;align-items:center;gap:7px;color:#bfd2e3;font-size:11px}
.secure-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px rgba(15,122,239,.7)}
.hero-copy{max-width:820px;margin:46px auto 0;text-align:center;position:relative;z-index:2}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid rgba(15,122,239,.28);
  background:rgba(15,122,239,.10);border-radius:999px;color:#8fc4ff;font-size:11px;font-weight:900;
  letter-spacing:.1em;text-transform:uppercase;
}
.eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px rgba(15,122,239,.7)}
h1{font-size:clamp(39px,11vw,82px);line-height:.97;letter-spacing:-.055em;margin:17px auto 15px;max-width:1000px}
.h1-blue{color:var(--accent)}
.lead{font-size:16px;color:#c8d6e5;max-width:740px;margin:0 auto}
.hero-layout{display:grid;grid-template-columns:1fr;gap:24px;align-items:center;position:relative;z-index:2;margin-top:34px}
.hero-art{
  position:relative;min-height:370px;border-radius:28px;border:1px solid rgba(255,255,255,.08);
  background:
    radial-gradient(circle at 50% 30%,rgba(255,255,255,.09),transparent 33%),
    linear-gradient(155deg,#0b1724 0%,#06111c 70%);
  overflow:hidden;box-shadow:var(--shadow);
}
.hero-art:before{
  content:"";position:absolute;inset:10% 6% auto 6%;height:62%;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(15,122,239,.18),transparent 62%);
  filter:blur(12px);
}
.hero-art:after{
  content:"";position:absolute;left:7%;right:7%;bottom:12%;height:1px;background:linear-gradient(90deg,transparent,rgba(15,122,239,.28),transparent);
}
.hero-art img{
  position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-51%);
  width:min(94%,560px);height:auto;filter:drop-shadow(0 34px 30px rgba(0,0,0,.55));
}
.art-badge{
  position:absolute;top:16px;left:16px;padding:8px 10px;border-radius:12px;background:rgba(4,12,20,.88);
  border:1px solid rgba(15,122,239,.22);backdrop-filter:blur(12px);font-size:11px;font-weight:850;color:#dbe9f7;
}
.art-badge strong{color:var(--accent)}
.hero-side{display:flex;flex-direction:column;gap:15px}
.hero-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-point{
  padding:14px;border:1px solid var(--line);background:rgba(7,18,29,.88);border-radius:16px;
}
.mini-point .mini-icon{
  width:34px;height:34px;border-radius:12px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);margin-bottom:10px;
}
.mini-point b{display:block;font-size:13px;margin-bottom:4px}.mini-point span{display:block;color:var(--muted);font-size:12px}
.offer{
  padding:20px;border:1px solid rgba(15,122,239,.25);border-radius:24px;
  background:linear-gradient(180deg,rgba(15,122,239,.11),rgba(255,255,255,.025));
  box-shadow:0 20px 50px rgba(0,0,0,.24);
}
.offer-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.offer-tag{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;background:var(--accent);color:#08182c;font-size:10px;font-weight:950;letter-spacing:.06em;text-transform:uppercase}
.old{color:#7e93aa;text-decoration:line-through;font-size:13px}
.installment-label{display:block;color:#d7e4ef;font-size:18px;margin-top:13px}
.price-tag{color:#9fb4c6;font-size:14px;font-weight:800}
.price-row{display:flex;align-items:flex-end;gap:8px}
.price{font-size:clamp(56px,18vw,92px);line-height:.84;color:var(--accent);font-weight:950;letter-spacing:-.07em}
.price-dec{font-size:18px;font-weight:900;color:#78b7ff;padding-bottom:7px}
.pix{font-size:15px;color:#a9b8c9;margin-top:10px}.pix strong{color:#eef6ff}
.cta{
  display:flex;justify-content:center;align-items:center;width:100%;min-height:59px;padding:0 20px;
  border:0;border-radius:17px;background:linear-gradient(180deg,#2f93ff,#0f6fdd);color:#061527;
  font-weight:950;font-size:16px;box-shadow:0 14px 30px rgba(15,122,239,.22);cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;margin-top:16px;
}
.cta:hover{transform:translateY(-2px);box-shadow:0 18px 36px rgba(15,122,239,.3);filter:saturate(1.05)}
.cta-arrow{margin-left:auto;font-size:20px}
.trust-line{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.trust-pill{
  padding:8px 7px;text-align:center;border-radius:12px;background:rgba(255,255,255,.025);color:#9cafc1;font-size:10px;border:1px solid var(--line)
}
.section{padding:52px 0;position:relative}
.section.soft{background:#07131f}
.section.light{
  color:#f4f9fe;background:linear-gradient(180deg,#f5faff 0%,#e8f3ff 100%);
}
.section.light .sub{color:#526879}.section.light .kicker{color:#0f6fdd}
.kicker{color:var(--accent);font-size:11px;font-weight:950;letter-spacing:.13em;text-transform:uppercase}
h2{font-size:clamp(31px,8vw,56px);line-height:.98;letter-spacing:-.045em;margin:10px 0 15px;max-width:900px}
.sub{color:var(--muted);max-width:760px;font-size:15px;margin:0}
.center{text-align:center}.center .sub{margin-left:auto;margin-right:auto}
.reveal{opacity:0;transform:translateY(28px) scale(.985);transition:opacity .7s ease,transform .7s cubic-bezier(.22,1,.36,1)}
.reveal.in{opacity:1;transform:none}
.stagger > *{opacity:0;transform:translateY(22px);transition:opacity .65s ease,transform .65s cubic-bezier(.22,1,.36,1)}
.stagger.in > *{opacity:1;transform:none}
.stagger.in > *:nth-child(1){transition-delay:.03s}.stagger.in > *:nth-child(2){transition-delay:.08s}
.stagger.in > *:nth-child(3){transition-delay:.13s}.stagger.in > *:nth-child(4){transition-delay:.18s}
.stagger.in > *:nth-child(5){transition-delay:.23s}.stagger.in > *:nth-child(6){transition-delay:.28s}
